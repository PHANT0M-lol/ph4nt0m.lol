<!DOCTYPE html>
<html lang="th" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHANTOM — Key Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Chakra Petch & Orbitron for geometric futuristic display, Noto Sans Thai & Noto Sans Arabic for multilingual support -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            phantom: {
              bg: '#0c0c0e',
              surface: '#141418',
              dropdown: '#1a1a1f',
              dropdownHover: '#24242b',
              border: '#26262d',
              borderFocus: '#4a4a55',
              error: '#b55454',
              errorBorder: '#9e4343',
              white: '#f2f2f4',
              muted: '#6b6b73',
              subtle: '#4a4a52'
            }
          },
          fontFamily: {
            display: ['"Chakra Petch"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Noto Sans Thai"', '"Noto Sans Arabic"', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    /* Base Page & Custom Subtle Geometric Background Pattern */
    body {
      background-color: #0b0b0d;
      color: #f2f2f4;
      font-family: 'Noto Sans Thai', 'Noto Sans Arabic', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Subtle dark tactical chevron/geometric background inspired by the screenshot */
    .bg-phantom-pattern {
      background-color: #0c0c0e;
      background-image: 
        radial-gradient(circle at 50% 34%, rgba(255, 255, 255, 0.045) 0%, rgba(12, 12, 14, 0) 52%),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.012) 0px,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    /* Chamfered (45-degree angled top-left & bottom-right corners) Input Wrapper */
    .chamfer-box {
      position: relative;
      background: #28282f; /* Default border color */
      clip-path: polygon(
        11px 0%,
        100% 0%,
        100% calc(100% - 11px),
        calc(100% - 11px) 100%,
        0% 100%,
        0% 11px
      );
      padding: 1.5px;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .chamfer-box:focus-within {
      background: #52525e;
    }

    .chamfer-box.is-error {
      background: #9c4343;
    }

    .chamfer-box-inner {
      background: #141418;
      clip-path: polygon(
        10px 0%,
        100% 0%,
        100% calc(100% - 10px),
        calc(100% - 10px) 100%,
        0% 100%,
        0% 10px
      );
    }

    /* Chamfered Primary White CTA Button */
    .chamfer-btn {
      background: #f0f0f2;
      color: #0c0c0e;
      clip-path: polygon(
        12px 0%,
        100% 0%,
        100% calc(100% - 12px),
        calc(100% - 12px) 100%,
        0% 100%,
        0% 12px
      );
      transition: background-color 0.18s ease, transform 0.12s ease, opacity 0.2s ease;
    }

    .chamfer-btn:hover {
      background: #ffffff;
    }

    .chamfer-btn:active {
      transform: scale(0.985);
      background: #dcdce0;
    }

    /* Subtle Ghost Glow */
    .ghost-glow {
      filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.14));
    }

    /* Shake animation for invalid key submission */
    @keyframes subtleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    .animate-shake {
      animation: subtleShake 0.35s ease-in-out;
    }

    /* Smooth dropdown fade */
    .dropdown-panel {
      transform-origin: top right;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    [dir="rtl"] .dropdown-panel {
      transform-origin: top left;
    }

    /* Custom subtle modal backdrop */
    .modal-backdrop {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="bg-phantom-pattern min-h-screen flex flex-col justify-between selection:bg-white selection:text-black">

        <button

  <!-- Main Centered Content -->

             L 124.6 196

        <!-- Left Eye Inner Shadow Facet -->

        <!-- Right Angled Polygonal Eye -->

          points="154,90 111,102 115,125 140,127 157,112"

        />

        <!-- Nasal Cavity Triangle -->

        />

        <!-- Jagged Zigzag Mouth -->
        <polyline

          fill="none"
          stroke="#36363d"

          stroke-linecap="square"
          stroke-linejoin="miter"

    </div>

    <!-- Brand Wordmark -->
    <h1

      style="margin-inline-end: -0.16em;"
    >
      PHANTOM
    </h1>

    <!-- Subtitle -->
    <p
      id="subtitleText"
      class="mt-3 text-[13px] sm:text-[13.5px] text-[#6c6c75] font-medium tracking-wide text-center"
    >
      ไม่ต้องมีบัญชี ไม่ต้องมีรหัสผ่าน ใช้แค่คีย์
    </p>

    <!-- Authentication Form -->
    <form id="authForm" class="w-full mt-9" novalidate>
      <!-- Input Label with small white square bullet -->
      <div class="flex items-center gap-2 mb-2.5 px-0.5">
        <span class="inline-block w-[6px] h-[6px] bg-[#d4d4d8] shrink-0"></span>
        <label
          id="inputLabel"
          for="keyInput"
          class="text-[12.5px] font-medium text-[#7e7e87] select-none cursor-pointer"
        >
          คีย์เข้าใช้งาน
        </label>
      </div>

      <!-- Chamfered Key Input Container -->
      <div id="inputWrapper" class="chamfer-box w-full">
        <div class="chamfer-box-inner flex items-center justify-between px-3.5 py-2.5 gap-2">
          <input
            id="keyInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="19"
            dir="ltr"
            placeholder="PHTM-XXXX-XXXX-XXXX"
            class="w-full bg-transparent text-[#f2f2f4] placeholder-[#4e4e57] font-mono text-[14.5px] sm:text-[15px] font-semibold tracking-[0.06em] focus:outline-none uppercase"
          />

          <!-- Inside-Right Paste Button -->
          <button
            id="pasteBtn"
            type="button"
            class="shrink-0 px-3.5 py-1.5 rounded-lg bg-[#222228] hover:bg-[#2c2c34] active:scale-95 text-[#a1a1aa] hover:text-white text-[12px] font-medium transition-all cursor-pointer"
          >
            วาง
          </button>
        </div>
      </div>

      <!-- Validation Error Message (Hidden by default, shown on invalid submit like Screenshot 2) -->
      <div
        id="errorContainer"
        role="alert"
        class="hidden items-center gap-2 mt-2.5 px-0.5 text-[#b85656] text-[12.5px] font-medium"
      >
        <span class="inline-block w-[6px] h-[6px] bg-[#b85656] shrink-0"></span>
        <span id="errorText">กรอกคีย์ให้ครบ</span>
      </div>

      <!-- Primary Unlock CTA Button -->
      <button
        id="unlockBtn"
        type="submit"
        class="chamfer-btn w-full mt-5 h-[52px] flex items-center justify-center gap-2.5 font-bold text-[15.5px] tracking-wide cursor-pointer select-none"
      >
        <span id="unlockBtnText">ปลดล็อก</span>
        <!-- Loading Spinner (hidden by default) -->
        <svg id="loadingSpinner" class="hidden animate-spin w-5 h-5 text-[#0c0c0e]" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-85" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      </button>
    </form>

    <!-- Footer Helper Texts -->

      </p>
      <p id="footerTimerNote" class="text-[11.5px] text-[#4c4c54]">
        เวลาของคุณจะเริ่มนับเมื่อเชื่อมต่อ
      </p>
    </footer>
  </main>

  <!-- Subtle Bottom Spacer for Mobile Viewport Balance -->
  <div class="h-6"></div>

  <!-- Toast Notification Banner (Non-intrusive feedback for Paste / Reseller info) -->

    id="toastBanner"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-200 px-4 py-2.5 rounded-xl bg-[#1d1d23] border border-white/10 text-[#e4e4e7] text-xs font-medium shadow-2xl flex items-center gap-2 whitespace-nowrap"
  >

    <span id="toastMessage">วางคีย์เรียบร้อยแล้ว</span>
  </div>

  <!-- Unlocked Session Status Modal (Appears when a valid 16-char key is unlocked) -->
  <div
    id="unlockedModal"
    class="hidden fixed inset-0 z-50 bg-black flex flex-col items-center justify-center overflow-hidden"
  >
    <!-- Full-screen Surprise Image (IMG_5467.jpeg) -->
    <img
      id="surpriseImage"
      src="IMG_5467.jpeg"
      alt="PHANTOM Unlocked"
      class="w-full h-full object-contain sm:object-cover select-none"
      onerror="handleMediaFallback('image')"
    />

    <!-- Hidden Video/Audio Player for 04026214722846b59d6632608d866994.mov sound track -->
    <video
      id="surpriseAudioPlayer"
      src="04026214722846b59d6632608d866994.mov"
      playsinline
      loop
      preload="auto"
      class="hidden"
      onerror="handleMediaFallback('audio')"
    ></video>

    <!-- Subtle Top Bar Controls (Volume indicator + Close/Back button + Optional file loader if local files aren't in same folder) -->
    <div class="fixed top-4 inset-x-4 z-50 flex items-center justify-between pointer-events-none">
      <div class="pointer-events-auto flex items-center gap-2 px-3 py-1.5 rounded-xl bg-black/70 border border-white/15 backdrop-blur-md text-xs font-mono text-white">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
        <span id="modalActiveKey">PHTM-XXXX-XXXX-XXXX</span>
      </div>

      <div class="pointer-events-auto flex items-center gap-2">
        <!-- Quick Media Picker button in case browser sandbox needs manual file selection -->
        <label
          id="fallbackMediaPickerBtn"
          for="customMediaInput"
          class="hidden px-3 py-1.5 rounded-xl bg-black/70 hover:bg-black/90 border border-white/15 backdrop-blur-md text-xs text-white/80 hover:text-white cursor-pointer transition-colors"
        >
          เลือกไฟล์รูป/เสียง
        </label>
        <input
          id="customMediaInput"
          type="file"
          accept="image/*,video/*,audio/*"
          multiple
          class="hidden"
        />

        <button
          id="disconnectBtn"
          type="button"
          class="px-3.5 py-1.5 rounded-xl bg-black/75 hover:bg-black border border-white/20 backdrop-blur-md text-xs font-semibold text-white cursor-pointer transition-all active:scale-95"
        >
          <span id="disconnectBtnText">ปิด</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Predefined Whitelist of 10 Valid PHANTOM Keys
    const VALID_KEYS = [
      'PHTM-8924-K7X2-M9Q1',
      'PHTM-4019-Z3V8-B6N5',
      'PHTM-7731-P4L9-W2C8',
      'PHTM-1582-R6D4-H9J3',

      'PHTM-8063-G9F7-Y1T5'
    ];
    let sampleKeyIndex = 0;

    // Translations Dictionary (Thai, English, Arabic)
    const translations = {
      th: {
        label: 'ไทย',
        dir: 'ltr',
        subtitle: 'ไม่ต้องมีบัญชี ไม่ต้องมีรหัสผ่าน ใช้แค่คีย์',

        errorInvalid: 'คีย์ไม่ถูกต้องหรือหมดอายุ',
        unlock: 'ปลดล็อก',
        noKeyPrefix: 'ยังไม่มีคีย์?',
        contactReseller: 'ติดต่อผู้ขายของคุณ',
        timerNote: 'เวลาของคุณจะเริ่มนับเมื่อเชื่อมต่อ',

        toastSampleKey: 'วางคีย์อัตโนมัติเรียบร้อยแล้ว',
        toastReseller: 'กรุณาติดต่อตัวแทนจำหน่ายเพื่อรับคีย์เข้าใช้งาน',

      },

        subtitle: 'No account. No password. Just a key.',
        inputLabel: 'Access Key',
        paste: 'Paste',
        errorEmpty: 'Please enter the full key',
        errorInvalid: 'Invalid or expired key',
        unlock: 'Unlock',
        noKeyPrefix: "Don't have a key?",
        contactReseller: 'Contact your reseller',
        timerNote: 'Your time starts counting upon connection',
        toastPasted: 'Key pasted from clipboard',
        toastSampleKey: 'Key pasted automatically',
        toastReseller: 'Please contact your authorized reseller for a key',
        closeBtn: 'Close'
      },
      ar: {
        label: 'العربية',
        dir: 'rtl',
        subtitle: 'لا حاجة لحساب. لا كلمة مرور. فقط مفتاح.',
        inputLabel: 'مفتاح الدخول',
        paste: 'لصق',
        errorEmpty: 'أدخل المفتاح بالكامل',
        errorInvalid: 'المفتاح غير صالح أو منتهي الصلاحية',
        unlock: 'فتح القفل',

        contactReseller: 'تواصل مع البائع الخاص بك',
        timerNote: 'سيبدأ احتساب وقتك عند الاتصال',
        toastPasted: 'تم لصق المفتاح بنجاح',
        toastSampleKey: 'تم لصق المفتاح تلقائياً',
        toastReseller: 'يرجى التواصل مع البائع للحصول على مفتاح',
        closeBtn: 'إغلاق'
      }
    };

    let currentLang = 'th';
    let lastErrorType = 'empty'; // 'empty' | 'invalid'

    // DOM Elements
    const htmlEl = document.documentElement;
    const langToggleBtn = document.getElementById('langToggleBtn');
    const langDropdown = document.getElementById('langDropdown');
    const currentLangLabel = document.getElementById('currentLangLabel');
    const langOptions = document.querySelectorAll('.lang-option');

    const subtitleText = document.getElementById('subtitleText');
    const inputLabel = document.getElementById('inputLabel');
    const keyInput = document.getElementById('keyInput');
    const inputWrapper = document.getElementById('inputWrapper');
    const pasteBtn = document.getElementById('pasteBtn');
    const errorContainer = document.getElementById('errorContainer');
    const errorText = document.getElementById('errorText');
    const authForm = document.getElementById('authForm');
    const unlockBtnText = document.getElementById('unlockBtnText');
    const footerReseller = document.getElementById('footerReseller');
    const footerTimerNote = document.getElementById('footerTimerNote');

    const toastBanner = document.getElementById('toastBanner');
    const toastMessage = document.getElementById('toastMessage');

    const unlockedModal = document.getElementById('unlockedModal');
    const surpriseImage = document.getElementById('surpriseImage');
    const surpriseAudioPlayer = document.getElementById('surpriseAudioPlayer');
    const fallbackMediaPickerBtn = document.getElementById('fallbackMediaPickerBtn');
    const customMediaInput = document.getElementById('customMediaInput');
    const modalActiveKey = document.getElementById('modalActiveKey');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const disconnectBtnText = document.getElementById('disconnectBtnText');

    let fallbackAudioCtx = null;
    let fallbackOscInterval = null;
    let toastTimeout = null;

    // Show non-intrusive toast message
    function showToast(msg) {
      toastMessage.textContent = msg;
      toastBanner.classList.remove('opacity-0', 'translate-y-2');
      toastBanner.classList.add('opacity-100', 'translate-y-0');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastBanner.classList.add('opacity-0', 'translate-y-2');
        toastBanner.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }

    // Handle missing relative files in isolated preview sandboxes
    function handleMediaFallback(type) {
      fallbackMediaPickerBtn.classList.remove('hidden');
      if (type === 'image') {
        surpriseImage.src = 'https://placehold.co/900x1200/141418/f2f2f4?text=IMG_5467.jpeg';
      }
    }

    // Allow user to load IMG_5467.jpeg / 04026214722846b59d6632608d866994.mov manually if needed
    customMediaInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      files.forEach((file) => {
        const objectUrl = URL.createObjectURL(file);
        if (file.type.startsWith('image/')) {
          surpriseImage.src = objectUrl;
        } else if (file.type.startsWith('video/') || file.type.startsWith('audio/')) {
          stopFallbackSynth();
          surpriseAudioPlayer.src = objectUrl;
          surpriseAudioPlayer.volume = 1.0;
          surpriseAudioPlayer.play().catch(() => {});
        }
      });
    });

    // Synthesized loud audio fallback ONLY if 04026214722846b59d6632608d866994.mov cannot be loaded by browser
    function startFallbackSynth() {
      try {
        if (fallbackAudioCtx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        fallbackAudioCtx = new AudioCtx();
        const playScreamingBurst = () => {
          if (!fallbackAudioCtx || unlockedModal.classList.contains('hidden')) return;
          const now = fallbackAudioCtx.currentTime;
          const osc = fallbackAudioCtx.createOscillator();
          const gain = fallbackAudioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(1180, now + 0.18);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.36);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.55);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

          osc.connect(gain);
          gain.connect(fallbackAudioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.62);
        };
        playScreamingBurst();
        fallbackOscInterval = setInterval(playScreamingBurst, 700);
      } catch (err) {}
    }

    function stopFallbackSynth() {
      if (fallbackOscInterval) {
        clearInterval(fallbackOscInterval);
        fallbackOscInterval = null;
      }
      if (fallbackAudioCtx) {
        fallbackAudioCtx.close().catch(() => {});
        fallbackAudioCtx = null;
      }
    }

    // Format key string into XXXX-XXXX-XXXX-XXXX (16 alphanumeric chars max)
    function formatKeyString(raw) {
      const cleaned = raw.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
      const chunks = cleaned.match(/.{1,4}/g);
      return chunks ? chunks.join('-') : '';
    }

    // Show error state with shake feedback
    function showErrorState(type = 'empty') {
      lastErrorType = type;
      const t = translations[currentLang];
      errorText.textContent = type === 'invalid' ? t.errorInvalid : t.errorEmpty;

      inputWrapper.classList.add('is-error');
      errorContainer.classList.remove('hidden');
      errorContainer.classList.add('flex');

      // Re-trigger shake animation
      inputWrapper.classList.remove('animate-shake');
      void inputWrapper.offsetWidth;
      inputWrapper.classList.add('animate-shake');
    }

    // Clear error state
    function clearErrorState() {
      inputWrapper.classList.remove('is-error', 'animate-shake');
      errorContainer.classList.add('hidden');
      errorContainer.classList.remove('flex');
    }

    // Apply language UI updates
    function setLanguage(lang) {
      if (!translations[lang]) return;
      currentLang = lang;
      const t = translations[lang];

      htmlEl.setAttribute('lang', lang);
      htmlEl.setAttribute('dir', t.dir);

      currentLangLabel.textContent = t.label;
      subtitleText.textContent = t.subtitle;
      inputLabel.textContent = t.inputLabel;
      pasteBtn.textContent = t.paste;
      errorText.textContent = lastErrorType === 'invalid' ? t.errorInvalid : t.errorEmpty;
      unlockBtnText.textContent = t.unlock;
      footerTimerNote.textContent = t.timerNote;
      disconnectBtnText.textContent = t.closeBtn;

      // Update footer reseller line while keeping interactive button
      footerReseller.innerHTML = `${t.noKeyPrefix} <button type="button" id="contactResellerTrigger" class="text-[#8e8e98] hover:text-white underline decoration-white/20 underline-offset-4 transition-colors cursor-pointer">${t.contactReseller}</button>`;
      document.getElementById('contactResellerTrigger').addEventListener('click', () => {
        showToast(translations[currentLang].toastReseller);
      });

      // Highlight selected language option & show checkmark
      langOptions.forEach((btn) => {
        const isSelected = btn.getAttribute('data-lang') === lang;
        const check = btn.querySelector('.check-icon');
        if (isSelected) {
          btn.classList.add('bg-[#23232a]', 'text-white');
          btn.classList.remove('text-[#e4e4e7]');
          check.classList.remove('hidden');
        } else {
          btn.classList.remove('bg-[#23232a]', 'text-white');
          btn.classList.add('text-[#e4e4e7]');
          check.classList.add('hidden');
        }
      });

      closeLangDropdown();
    }

    // Dropdown open/close handlers
    function openLangDropdown() {
      langDropdown.classList.remove('hidden');
      requestAnimationFrame(() => {
        langDropdown.classList.remove('opacity-0', 'scale-95');
        langDropdown.classList.add('opacity-100', 'scale-100');
      });
      langToggleBtn.setAttribute('aria-expanded', 'true');
    }

    function closeLangDropdown() {
      langDropdown.classList.add('opacity-0', 'scale-95');
      langDropdown.classList.remove('opacity-100', 'scale-100');
      langToggleBtn.setAttribute('aria-expanded', 'false');
      setTimeout(() => {
        if (langToggleBtn.getAttribute('aria-expanded') === 'false') {
          langDropdown.classList.add('hidden');
        }
      }, 150);
    }

    langToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = langToggleBtn.getAttribute('aria-expanded') === 'true';
      if (isOpen) {
        closeLangDropdown();
      } else {
        openLangDropdown();
      }
    });

    langOptions.forEach((btn) => {
      btn.addEventListener('click', () => {
        setLanguage(btn.getAttribute('data-lang'));
      });
    });

    document.addEventListener('click', (e) => {
      if (!document.getElementById('langMenuContainer').contains(e.target)) {
        closeLangDropdown();
      }
    });

    // Auto-format input on typing or direct Ctrl+V / Cmd+V paste
    keyInput.addEventListener('input', () => {
      keyInput.value = formatKeyString(keyInput.value);
      if (keyInput.value.length > 0) {
        clearErrorState();
      }
    });

    keyInput.addEventListener('paste', (e) => {
      e.preventDefault();
      const pastedText = (e.clipboardData || window.clipboardData)?.getData('text') || '';
      if (pastedText) {
        keyInput.value = formatKeyString(pastedText);
        clearErrorState();
        showToast(translations[currentLang].toastPasted);
      }
    });

    // Reliable Paste Button: reads clipboard first, falls back cleanly to cycling the 10 valid keys if clipboard is blocked or empty
    pasteBtn.addEventListener('click', async () => {
      const t = translations[currentLang];
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const clipText = await navigator.clipboard.readText();
          const formatted = formatKeyString(clipText || '');
          if (formatted.length > 0) {
            keyInput.value = formatted;
            clearErrorState();
            keyInput.focus();
            showToast(t.toastPasted);
            return;
          }
        }
      } catch (err) {
        // Clipboard permission denied in sandboxed iframe — fall through to valid key auto-paste
      }

      // Fallback: auto-fill one of the 10 valid keys so pasting always works smoothly
      const fallbackKey = VALID_KEYS[sampleKeyIndex % VALID_KEYS.length];
      sampleKeyIndex += 1;
      keyInput.value = fallbackKey;
      clearErrorState();
      keyInput.focus();
      showToast(t.toastSampleKey);
    });

    // Initial Reseller Trigger
    document.getElementById('contactResellerTrigger').addEventListener('click', () => {
      showToast(translations[currentLang].toastReseller);
    });

    // Form Submission & 10-Key Whitelist Validation
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const formattedKey = formatKeyString(keyInput.value);
      keyInput.value = formattedKey;
      const rawChars = formattedKey.replace(/[^A-Z0-9]/g, '');

      // 1. Check if key is empty or fewer than 16 characters
      if (rawChars.length < 16) {
        showErrorState('empty');
        keyInput.focus();
        return;
      }

      // 2. Check if key matches one of the 10 valid keys
      if (!VALID_KEYS.includes(formattedKey)) {
        showErrorState('invalid');
        keyInput.focus();
        return;
      }

      clearErrorState();

      // 3. Valid key matched: play audio from 04026214722846b59d6632608d866994.mov and show IMG_5467.jpeg
      surpriseAudioPlayer.currentTime = 0;
      surpriseAudioPlayer.volume = 1.0;
      const playPromise = surpriseAudioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          startFallbackSynth();
        });
      }

      modalActiveKey.textContent = formattedKey;
      unlockedModal.classList.remove('hidden');
    });

    // Close Unlocked Modal & Stop Sound
    function closeSurpriseModal() {
      unlockedModal.classList.add('hidden');
      surpriseAudioPlayer.pause();
      surpriseAudioPlayer.currentTime = 0;
      stopFallbackSynth();
    }

    disconnectBtn.addEventListener('click', closeSurpriseModal);
  </script>
</body>
</html>
